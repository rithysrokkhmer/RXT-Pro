<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Quantum Shield Background -->
    <linearGradient id="rxt_shield_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Outer Rim Gradient (Emerald to Cyan to Indigo) -->
    <linearGradient id="rxt_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="45%" stop-color="#00d9f5"/>
      <stop offset="85%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <!-- Bold Emerald-to-Cyan Main Monogram Gradient -->
    <linearGradient id="rxt_r_cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="45%" stop-color="#00d9f5"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Pure Warm Gold Bullion Gradient (XAU/USD Gold Spot Alpha) -->
    <linearGradient id="rxt_r_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="35%" stop-color="#ffd166"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Inner Bevel Subtle Glow -->
    <linearGradient id="rxt_bevel_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </linearGradient>

    <!-- Bloom Glow Filter -->
    <filter id="rxt_bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="rxt_core_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="glowBlur"/>
      <feMerge>
        <feMergeNode in="glowBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow Aura -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(0, 245, 160, 0.08)" stroke-width="5" filter="url(#rxt_bloom)"/>

  <!-- Master Hexagonal Quantum Shield Plate -->
  <polygon points="50,4 88,22 88,68 50,96 12,68 12,22" 
           fill="url(#rxt_shield_bg)" 
           stroke="url(#rxt_rim)" 
           stroke-width="2.5" 
           stroke-linejoin="round"/>

  <!-- Inner High-Tech Chamfered Bevel Frame -->
  <polygon points="50,10 82,26 82,64 50,90 18,64 18,26" 
           fill="none" 
           stroke="rgba(0, 217, 245, 0.22)" 
           stroke-width="1.2" 
           stroke-linejoin="round"/>

  <!-- Micro Circuit Nodes on Vertices -->
  <circle cx="50" cy="4" r="1.5" fill="#00f5a0"/>
  <circle cx="88" cy="22" r="1.5" fill="#00d9f5"/>
  <circle cx="88" cy="68" r="1.5" fill="#6366f1"/>
  <circle cx="50" cy="96" r="1.5" fill="#00f5a0"/>
  <circle cx="12" cy="68" r="1.5" fill="#6366f1"/>
  <circle cx="12" cy="22" r="1.5" fill="#00d9f5"/>

  <!-- Top Apex Gold Arrowhead (Alpha Breakout Direction) -->
  <polygon points="50,13 60,20 50,23 40,20" 
           fill="url(#rxt_r_gold)" 
           filter="url(#rxt_bloom)"/>

  <!-- ================= MONOGRAM SYMBOL "R" ================= -->
  <!-- 1. Left Vertical Main Power Pillar -->
  <path d="M24,23 L38,23 L38,77 L24,77 Z" 
        fill="url(#rxt_r_cyber)"/>
  
  <!-- Left Pillar Sleek High-Voltage Light Trace -->
  <line x1="31" y1="28" x2="31" y2="72" 
        stroke="#ffffff" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        opacity="0.85" 
        filter="url(#rxt_bloom)"/>

  <!-- 2. Upper Chamfered Loop of "R" -->
  <path d="M38,23 L59,23 C70,23 77,29 77,39 C77,49 70,55 59,55 L38,55 Z 
           M38,32.5 L57,32.5 C63.5,32.5 67,35 67,39 C67,43 63.5,45.5 57,45.5 L38,45.5 Z" 
        fill="url(#rxt_r_cyber)" 
        fill-rule="evenodd"/>

  <!-- Upper Loop Specular Highlight Rim -->
  <path d="M38,23 L59,23 C68,23 74,27 76,34" 
        fill="none" 
        stroke="url(#rxt_bevel_glow)" 
        stroke-width="1.5" 
        stroke-linecap="round"/>

  <!-- 3. Dynamic Alpha Diagonal Leg of "R" (Descending Support with Angled Foot) -->
  <path d="M47,53 L77,77 L63,77 L38,55 Z" 
        fill="url(#rxt_r_cyber)"/>

  <!-- 4. Ascending Golden Breakout Laser Vector (Trade Execution Vector) -->
  <!-- Laser Beam running along the diagonal leg -->
  <path d="M51,53 L78,77 L73,77 L46,53 Z" 
        fill="url(#rxt_r_gold)" 
        filter="url(#rxt_bloom)"/>

  <!-- 5. Central Quantum Core Diamond (Dual Diamond Engine in the R loop) -->
  <polygon points="51,34 56.5,39 51,44 45.5,39" 
           fill="#ffffff" 
           stroke="url(#rxt_r_gold)" 
           stroke-width="1.4" 
           filter="url(#rxt_core_glow)"/>

  <polygon points="51,36.5 54,39 51,41.5 48,39" 
           fill="url(#rxt_r_gold)"/>
</svg>